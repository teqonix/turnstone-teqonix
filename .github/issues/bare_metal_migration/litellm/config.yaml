# =============================================================================
# Turnstone LiteLLM Load Balancer Configuration (Template)
# Load Balancing: NVIDIA Personal AI Router (PAIR)
# =============================================================================

router_settings:
  routing_strategy: simple-shuffle
  routing_strategy_args:
    ttl: 30
  num_retries: 10
  timeout: 600
  allowed_fails: 4
  cooldown_time: 30
general_settings:
  master_key: ${MASTER_KEY}
  database_url: ${DATABASE_URL}
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  maximum_spend_logs_retention_period: 21d
  drop_params: true
litellm_settings:
  drop_params: true
  set_verbose: false
  telemetry: false
model_list:
- model_name: gemma-4-31b
  litellm_params:
    model: ollama/gemma4:31b
    api_base: http://127.0.0.1:11434
  model_info:
    supports_reasoning: true
- model_name: qwen-3.8-27b
  litellm_params:
    model: ollama/qwen3.8:27b
    api_base: http://127.0.0.1:11434
  model_info:
    supports_reasoning: true
- model_name: ornith-1.5-9b
  litellm_params:
    model: ollama/ornith-1.5:9b
    api_base: http://127.0.0.1:11434
